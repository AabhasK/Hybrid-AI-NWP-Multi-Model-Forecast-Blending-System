services:
  refresher:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      OPENMETEO_API_KEY: ${OPENMETEO_API_KEY:-}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-10800}
      LIVE_CACHE_TTL_SECONDS: ${LIVE_CACHE_TTL_SECONDS:-7200}
      SITE_DIR: /srv/site
    volumes:
      - dashboard-site:/srv/site

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - refresher
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - dashboard-site:/usr/share/nginx/html:ro
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dashboard-site:
