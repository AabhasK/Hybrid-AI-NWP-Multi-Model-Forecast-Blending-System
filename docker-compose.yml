services:
  refresher:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-10800}
      SITE_DIR: /srv/site
    volumes:
      - dashboard-site:/srv/site

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - refresher
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - dashboard-site:/usr/share/nginx/html:ro
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dashboard-site:
